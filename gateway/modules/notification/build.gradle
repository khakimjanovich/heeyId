// The notification module: what heeyID tells a person, and when (SAD §10.1).
dependencies {
    implementation libs.spring.boot.core // @Service
    // @NamedInterface; the Modulith BOM sets the version. `api`: a caller's javac reads the
    // annotation on this module's package and, with -Werror, stops when the class is missing.
    api 'org.springframework.modulith:spring-modulith-api'
}
