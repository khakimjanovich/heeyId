# Format check, unit and integration tests: each adapter in its own job.
# The platform and the contracts come published (GitHub Packages, packages: read). Pushes to main and every pull request.
# The contracts come published from khakimjanovich/contracts, which lints and checks them.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", "docs/**"]

permissions:
  contents: read
  packages: read

# A newer push to the same branch or pull request cancels the run it makes obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapters:
    name: ${{ matrix.adapter }}
    runs-on: self-hosted # the owner's runner for this repository (GitHub's hosted runners are unavailable)
    strategy:
      fail-fast: false
      matrix:
        adapter: [myid, sms]
    steps:
      - uses: actions/checkout@v7
      - name: The packages token is there
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          [ -n "$PACKAGES_READ_TOKEN" ] || { echo "::error::Secret PACKAGES_READ_TOKEN is missing: a classic token with read:packages, the owner's"; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew -p adapters/${{ matrix.adapter }} check
        env:
          GH_PACKAGES_ACTOR: ${{ github.repository_owner }}
          GH_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }} # the private platform and contracts packages
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.adapter }}
          path: |
            adapters/${{ matrix.adapter }}/build/reports/tests/
            adapters/${{ matrix.adapter }}/build/test-results/
