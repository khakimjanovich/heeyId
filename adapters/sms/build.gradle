// The SMS adapter: a service that sends SMS through the bank's SMS vendors (SMS Xabar first) and
// offers them as the contracts repository's sms-adapter-api. Other services call it through
// sms-adapter-client.
plugins {
    alias libs.plugins.spring.boot
    id 'platform.java'
    id 'platform.integration-test'
}

dependencies {
    implementation contracts.sms.adapter.api
    implementation libs.platform.error
    implementation libs.platform.security // callers: a trusted issuer, the audience and the role
    implementation libs.starter.webmvc
    implementation libs.starter.validation
    implementation libs.starter.actuator
    implementation libs.platform.observability // logs, traces and metrics, the same in every service
    implementation libs.starter.restclient // the traced RestClient.Builder every client is built from
    implementation libs.starter.data.redis // Valkey: the idempotency keys and the message statuses

    integrationTestImplementation libs.wiremock
    integrationTestImplementation libs.testcontainers.core
    integrationTestImplementation libs.testcontainers.junit
}
